<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 幹部專用，不讓搜尋引擎收錄 -->
  <meta name="robots" content="noindex, nofollow">
  <title>南三團費用統計</title>
  <style>
    /* ============================================================
       帳本風格：暖色紙張底、咖啡色字、金額靠右對齊、每家一列
       （和出席表單的綠色、出席統計頁區分開來）
       ============================================================ */
    :root {
      --paper: #f6f0e4;
      --sheet: #fffdf8;
      --ink: #4a3726;
      --ink-soft: #8a7560;
      --ink-faint: #b9a68e;
      --rule: #e6dac5;
      --rule-strong: #cdb894;
      --accent: #b9772e;
      --accent-bg: #f6e7cf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--sheet);
      max-width: 720px;
      width: 100%;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 28px 24px 32px;
      box-shadow: 0 1px 0 var(--rule), 0 6px 18px rgba(90, 60, 20, 0.06);
    }

    /* 頁首：細線標題＋月份標籤 */
    .page-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 3px double var(--rule-strong);
    }

    h1 {
      font-size: 22px;
      margin: 0;
      color: var(--ink);
      letter-spacing: 1px;
    }

    .month-tag {
      font-size: 13px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 3px;
      background: var(--accent);
      color: #fff;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-soft);
      margin: 10px 0 22px;
    }

    .toolbar button {
      padding: 4px 12px;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }

    .toolbar button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* 總計：三欄，用直線分隔 */
    .summary {
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      border: 1px solid var(--rule);
      border-radius: 4px;
      margin-bottom: 26px;
    }

    .summary .cell {
      padding: 12px 14px;
      border-left: 1px solid var(--rule);
    }

    .summary .cell:first-child {
      border-left: none;
      background: var(--accent-bg);
    }

    .summary .label {
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 1px;
    }

    .summary .num {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 2px 0;
    }

    .summary .cell:first-child .num {
      color: var(--accent);
    }

    .summary .sub {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    /* 小隊分頁：文字＋底線（選到的那隊用小隊顏色） */
    :where(.team-tabs button, .team-head) { --team: #8a7560; --team-bg: #f3efe7; }
    [data-team="花叢小隊"] { --team: #b4527a; --team-bg: #fbeaf0; }
    [data-team="天空小隊"] { --team: #3f73ab; --team-bg: #e6f0fb; }
    [data-team="草原小隊"] { --team: #4f8a33; --team-bg: #eaf5e3; }
    [data-team="大地小隊"] { --team: #96692c; --team-bg: #f5ebdc; }

    .team-tabs {
      display: flex;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 0;
    }

    .team-tabs button {
      flex: 1;
      border: none;
      border-bottom: 3px solid transparent;
      background: none;
      color: var(--ink-faint);
      font-size: 15px;
      padding: 8px 4px 7px;
      cursor: pointer;
      margin-bottom: -1px;
    }

    .team-tabs button.on {
      color: var(--team);
      border-bottom-color: var(--team);
      font-weight: 700;
    }

    .team-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 4px;
      color: var(--team);
    }

    .team-head .name {
      font-size: 17px;
      font-weight: 700;
    }

    .team-head .count {
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* 帳本表格：家庭｜餐費｜房費｜合計 */
    .ledger {
      --grid: minmax(0, 1fr) 92px 104px 104px;
    }

    .ledger.meal-only {
      --grid: minmax(0, 1fr) 104px;
    }

    .ledger .row {
      display: grid;
      grid-template-columns: var(--grid);
      column-gap: 20px;
      padding: 12px 8px;
      border-top: 1px solid var(--rule);
    }

    .ledger .row:nth-child(even of .family-row) {
      background: #fcf8f0;
    }

    .ledger .head-row {
      border-top: none;
      padding: 6px 4px;
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 1px;
    }

    .ledger .amt {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ledger .amt .note {
      display: block;
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .ledger .total {
      font-weight: 700;
    }

    .fam-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fam-name {
      font-weight: 700;
      font-size: 15px;
    }

    /* 名字後面的用餐人數 */
    .meal-badge {
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 3px;
      background: #fbf3e6;   /* 比總計那格的底色再淡一點 */
      color: var(--accent);
      white-space: nowrap;
    }

    .meal-badge b {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    /* 這家有用餐的人 */
    .meal-names {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 4px;
      line-height: 1.6;
    }

    .meal-names .person {
      white-space: nowrap;
    }

    .chip {
      display: inline-block;
      font-size: 12px;
      padding: 1px 8px;
      margin-top: 4px;
      border-radius: 3px;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
    }

    /* 小計列：在家庭列表最上面，下方雙線和各家分開 */
    .ledger .foot-row {
      border-top: 1px solid var(--rule-strong);
      border-bottom: 3px double var(--rule-strong);
      background: var(--team-bg, transparent);
      font-weight: 700;
      color: var(--team, var(--ink));
    }

    .ledger .foot-row + .row {
      border-top: none;
    }

    .empty-team,
    .message {
      text-align: center;
      color: var(--ink-faint);
      padding: 24px 0;
      font-size: 14px;
    }

    .message {
      padding: 40px 0;
    }

    .summary .sub .line {
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .card { padding: 20px 14px 24px; }
      /* 手機：全團合計自己一排，餐費、房費並排 */
      .summary.three { grid-template-columns: 1fr 1fr; }
      .summary.three .cell:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--rule); }
      .summary.three .cell:nth-child(2) { border-left: none; }
      .summary .cell { padding: 10px; }
      .summary .num { font-size: 18px; }
    }

    /* 手機：家庭名稱一整排，下面一排三格金額（每格上方有小標題），不會擠 */
    @media (max-width: 520px) {
      .ledger .head-row { display: none; }
      .ledger .row {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 8px;
        column-gap: 0;
        padding: 12px 6px;
      }
      .ledger.meal-only .row { grid-template-columns: 1fr; }
      .ledger .row > :first-child { grid-column: 1 / -1; }
      .ledger .amt {
        text-align: left;
        padding: 6px 10px;
        border-left: 1px solid var(--rule);
        background: rgba(255, 255, 255, 0.6);
      }
      .ledger .amt:nth-child(2) { border-left: none; }
      .ledger .amt::before {
        content: attr(data-label);
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--ink-faint);
        letter-spacing: 1px;
      }
      .ledger.meal-only .amt { text-align: right; border-left: none; background: none; padding: 0; }
      .ledger.meal-only .amt::before { content: none; }
      .ledger.meal-only .row > :first-child { grid-column: auto; }
      .ledger.meal-only .row { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="page-head">
      <h1>費用統計</h1>
      <span class="month-tag" id="monthTag"></span>
    </div>
    <div class="toolbar" id="toolbar">
      <span id="updated">讀取中…</span>
      <button id="refreshBtn" type="button">重新整理</button>
    </div>
    <div id="content"><div class="message">讀取中…</div></div>
  </div>

  <script>
    /* ============================================================
       幹部專用：各家庭費用統計（依小隊 花叢 → 天空 → 草原 → 大地）
       網址：fees.html?month=1月  → 讀「1月-費用統計」
             fees.html?label=12月 → 讀「餐費統計」（12月分頁沒有月份，只有餐費）
       不需要密碼：打開就讀資料（不放在表單連結裡，只把網址給幹部）
       ============================================================ */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyogdHKOd1yRbqzglVpDZL_i1sRR-1iq69zucNT1gIeuZund9AmvWvM0WxTrKCrw905/exec";
    const params = new URLSearchParams(location.search);
    // 有 label 沒 month 是 12月（試算表分頁沒有月份）；兩個都沒有時預設 1月
    const MONTH = params.get("month") ?? (params.get("label") ? "" : "1月"); // 試算表分頁用的月份
    const LABEL = params.get("label") || MONTH;                              // 標題顯示的月份
    const TEAM_ORDER = ["花叢小隊", "天空小隊", "草原小隊", "大地小隊"];

    document.getElementById("monthTag").textContent = LABEL;
    document.title = `${LABEL}費用統計`;

    const content = document.getElementById("content");
    const updatedEl = document.getElementById("updated");
    const refreshBtn = document.getElementById("refreshBtn");

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 房型只顯示房型本身，不顯示拆房意願：「4人房・有意願拆成2人房」→「4人房」
    const roomLabel = t => String(t).split("・")[0];

    /* ---------- 家庭排序：和表單 Step2 名單同順序 ----------
       各月表單裡的 TEAM_DATA 就是名單，從表單讀出順序；
       新增月份時，在這裡加上「月份: 表單資料夾」 */
    const FORM_PAGES = { "12月": "./", "1月": "january/" };
    let familyOrder = null; // 自然名 → 在名單裡的順序
    const memberCat = {};   // 自然名 → 分類代碼（表單名單裡的 category，例如 A小蟻）
    let mealFeeOf = null;   // 表單裡的 getMealFee：分類代碼 → 每人餐費

    async function loadFamilyOrder() {
      if (familyOrder || !FORM_PAGES[LABEL]) return;
      try {
        const src = await (await fetch(FORM_PAGES[LABEL])).text();
        const lit = src.match(/const TEAM_DATA = (\{[\s\S]*?\n\s*\});/)[1];
        const teamData = Function('"use strict"; return ' + lit)();
        // 每人餐費也從表單讀（各月價格不同，例如 12月 $90、1月 $150）
        const feeFn = src.match(/function getMealFee\(category\) \{[\s\S]*?\n\s*\}/);
        if (feeFn) mealFeeOf = Function('"use strict"; return (' + feeFn[0] + ")")();
        familyOrder = {};
        let i = 0;
        Object.values(teamData).forEach(list => list.forEach(fam => {
          fam.members.forEach(m => { familyOrder[m.name] = i; memberCat[m.name] = m.category; });
          i++;
        }));
      } catch (err) {
        console.warn("讀不到表單名單，家庭照填單先後排列：", err);
      }
    }

    // 依名單順序排；找不到的家庭排在最後（維持填單先後）
    function sortFamilies(list) {
      if (!familyOrder) return list;
      const pos = f => familyOrder[f.registrant] ?? Infinity;
      return list.map((f, i) => [f, i]).sort((a, b) => (pos(a[0]) - pos(b[0])) || (a[1] - b[1])).map(x => x[0]);
    }

    const num = v => Number(v) || 0;
    const money = v => "$" + num(v).toLocaleString("en-US");

    /* ---------- 向後台要資料 ---------- */
    async function loadFees() {
      refreshBtn.disabled = true;
      updatedEl.textContent = "讀取中…";

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "fees", month: MONTH }),
          signal: controller.signal
        });
        const result = await res.json();
        if (result.status !== "success") throw new Error(result.message || "後台回傳失敗");

        await loadFamilyOrder();
        lastFamilies = result.families || [];
        render(lastFamilies);
        updatedEl.textContent = "更新時間 " + new Date().toLocaleTimeString("zh-TW", { hour12: false });
      } catch (err) {
        console.error("讀取費用失敗：", err);
        updatedEl.textContent = "讀取失敗，請按「重新整理」再試一次";
        if (!content.querySelector(".summary")) {
          content.innerHTML = `<div class="message">讀取失敗：${escapeHtml(err.name === "AbortError" ? "連線逾時" : err.message)}</div>`;
        }
      } finally {
        clearTimeout(timer);
        refreshBtn.disabled = false;
      }
    }

    // 用餐人數分大人／小孩（照表單名單的分類代碼）：
    //   小孩＝小蟻、小蜂
    //   小小蟻不收餐費，大人小孩都不算
    //   其他（含小鹿、小鷹、各團大人）＝大人
    // 後台沒回傳用餐名單時（或名單對不上），只顯示總人數
    const KID_CATEGORIES = ["A小蟻", "B小蜂"];
    const UNCOUNTED_CATEGORIES = ["S小小蟻"];

    // 這家要算的用餐名單（去掉小小蟻）；後台沒回傳名單時回傳 null
    function countedMealNames(f) {
      if (!f.mealNames || !f.mealNames.length) return null;
      return f.mealNames.filter(n => !UNCOUNTED_CATEGORIES.includes(memberCat[n]));
    }

    function mealSplit(families) {
      const total = families.reduce((n, f) => n + (countedMealNames(f)?.length ?? num(f.mealCount)), 0);
      const names = families.flatMap(f => f.mealNames || []);
      if (!names.length || !Object.keys(memberCat).length) return `用餐 ${total} 人`;
      let adult = 0, kid = 0;
      const adultPrices = new Set(), kidPrices = new Set();
      names.forEach(n => {
        const cat = memberCat[n];
        if (UNCOUNTED_CATEGORIES.includes(cat)) return;
        const price = mealFeeOf ? mealFeeOf(cat) : null;
        if (KID_CATEGORIES.includes(cat)) { kid++; kidPrices.add(price); }
        else { adult++; adultPrices.add(price); }
      });
      return `<span class="line">大人 <b>${adult}</b> 人${priceText(adultPrices)}</span><br>`
        + `<span class="line">小孩 <b>${kid}</b> 人${priceText(kidPrices)}</span>`;
    }

    // 人數後面的每人餐費：「 × $90」；讀不到價格或同組價格不一樣就不顯示
    function priceText(prices) {
      if (prices.size !== 1) return "";
      const p = [...prices][0];
      return typeof p === "number" ? ` × ${money(p)}` : "";
    }

    /* ---------- 畫面 ---------- */
    function render(families) {
      if (!families.length) {
        content.innerHTML = `<div class="message">${escapeHtml(LABEL)}還沒有家庭填寫</div>`;
        return;
      }
      // 12月的「餐費統計」金額欄標題是「合計」（不是「餐費合計」），當成餐費，不另外顯示成小標籤
      families.forEach(f => {
        if (f.mealFee === undefined && f.extra && f.extra["合計"] !== undefined) {
          f.mealFee = num(f.extra["合計"]);
          delete f.extra["合計"];
        }
      });
      // 12月沒有住宿：試算表沒有房費欄，就不顯示房費和住宿
      const hasLodging = families.some(f => f.roomFee !== undefined);

      const sum = (list, key) => list.reduce((n, f) => n + num(f[key]), 0);
      // 費用合計欄空白時（舊資料），用餐費＋房費補上
      families.forEach(f => { if (f.total === "" || f.total == null) f.total = num(f.mealFee) + num(f.roomFee); });

      const byTeam = {};
      families.forEach(f => (byTeam[f.team || "未分小隊"] = byTeam[f.team || "未分小隊"] || []).push(f));
      // 花天草地固定都有分頁；試算表裡如果有其他小隊名稱，排在最後
      const teams = TEAM_ORDER.concat(Object.keys(byTeam).filter(t => !TEAM_ORDER.includes(t)));
      if (!teams.includes(selectedTeam)) selectedTeam = teams[0];

      // 總計
      let html = `<div class="summary${hasLodging ? " three" : ""}" style="--cols:${hasLodging ? 3 : 2}">
        <div class="cell"><div class="label">全團合計</div><div class="num">${money(sum(families, "total"))}</div>
          <div class="sub">${families.length} 家庭</div></div>
        <div class="cell"><div class="label">餐費</div><div class="num">${money(sum(families, "mealFee"))}</div>
          <div class="sub">${mealSplit(families)}</div></div>
        ${hasLodging ? `<div class="cell"><div class="label">房費</div><div class="num">${money(sum(families, "roomFee"))}</div>
          <div class="sub">住宿 ${sum(families, "lodgingCount")} 人</div></div>` : ""}
      </div>`;

      // 小隊分頁
      html += `<div class="team-tabs">${teams.map(t =>
        `<button type="button" data-team="${escapeHtml(t)}"${t === selectedTeam ? ' class="on"' : ""}>${escapeHtml(t.replace(/小隊$/, ""))}</button>`).join("")}</div>`;

      const team = selectedTeam;
      const list = sortFamilies(byTeam[team] || []);
      html += `<div class="team-head" data-team="${escapeHtml(team)}">
          <span class="name">${escapeHtml(team)}</span>
          <span class="count">${list.length} 家庭</span>
        </div>`;

      if (!list.length) {
        content.innerHTML = html + `<div class="empty-team">這個小隊還沒有家庭填寫</div>`;
        return;
      }

      // 帳本：每家一列
      html += `<div class="ledger${hasLodging ? "" : " meal-only"}" data-team="${escapeHtml(team)}">
        <div class="row head-row"><span>家庭</span>${hasLodging
          ? `<span class="amt">餐費</span><span class="amt">房費</span><span class="amt">合計</span>`
          : `<span class="amt">餐費</span>`}</div>`;

      // 小計列：放在最上面（表頭下方），先看到這隊的總數
      html += `<div class="row foot-row"><span>小計</span>${hasLodging
        ? `<span class="amt" data-label="餐費">${money(sum(list, "mealFee"))}</span><span class="amt" data-label="房費">${money(sum(list, "roomFee"))}</span><span class="amt" data-label="合計">${money(sum(list, "total"))}</span>`
        : `<span class="amt">${money(sum(list, "total"))}</span>`}</div>`;

      list.forEach(f => {
        // 用餐人數不算小小蟻（名單照列，小小蟻加括號）；後台沒回傳名單時，用試算表的用餐人數
        const eaters = countedMealNames(f);
        const names = f.mealNames && f.mealNames.length
          ? `<div class="meal-names">${f.mealNames.map(n => UNCOUNTED_CATEGORIES.includes(memberCat[n])
              ? `<span class="person">（${escapeHtml(n)}）</span>`
              : `<span class="person">${escapeHtml(n)}</span>`).join("、")}</div>` : "";
        const extra = Object.entries(f.extra || {}).map(([k, v]) =>
          `<span class="chip">${escapeHtml(k)}：${escapeHtml(v)}</span>`).join(" ");
        const lodged = num(f.lodgingCount) || f.roomType;

        html += `<div class="row family-row">
          <div>
            <div class="fam-line"><span class="fam-name">${escapeHtml(f.registrant)}家</span>
              <span class="meal-badge">用餐 <b>${eaters ? eaters.length : num(f.mealCount)}</b> 人</span></div>
            ${names}${extra}
          </div>
          ${hasLodging ? `
            <div class="amt" data-label="餐費">${money(f.mealFee)}</div>
            <div class="amt" data-label="房費">${lodged ? money(f.roomFee) : "—"}<span class="note">${lodged
              ? escapeHtml(roomLabel(f.roomType || "")) || `${num(f.lodgingCount)} 人`
              : "不住宿"}</span></div>
            <div class="amt total" data-label="合計">${money(f.total)}</div>`
          : `<div class="amt total" data-label="餐費">${money(f.total)}</div>`}
        </div>`;
      });

      html += `</div>`;

      content.innerHTML = html;
    }

    // 目前看的小隊（預設花叢）；按「重新整理」後維持原本選的小隊
    let selectedTeam = TEAM_ORDER[0];
    let lastFamilies = [];
    content.addEventListener("click", e => {
      const btn = e.target.closest(".team-tabs button");
      if (!btn || btn.dataset.team === selectedTeam) return;
      selectedTeam = btn.dataset.team;
      render(lastFamilies);
    });

    refreshBtn.addEventListener("click", () => loadFees());

    // 打開就讀資料
    loadFees();
  </script>

</body>
</html>
